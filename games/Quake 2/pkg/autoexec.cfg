// Hyperpixel 4.0 XP 720x720 4-inch + Arduino Leonardo (GamerCard)
// Yamagi 8.70: use set, not seta.

set vid_renderer gl1
set vid_fullscreen 1
set vid_highdpiaware 0
set r_mode -1
set r_customwidth 720
set r_customheight 720
set r_vsync 1
set vid_maxfps 60
set cl_async 0
set cl_run 1
set cl_yawspeed 140
set cl_pitchspeed 150
set s_openal 0
set gl1_lightmapcopies 1
set gl1_pointparameters 0
set r_msaa_samples 0
set r_anisotropic 1

// Menu: Brightness 1.7, Overbrights 2, Min. Light Level 8.
// vid_gamma does nothing on Wayland (SDL cannot set hardware gamma).
set vid_gamma 1.7
set gl1_overbrightbits 2
set gl1_minlight 8

// Auto scale is width/640 = 1 on 720x720, so HUD/menu stay tiny on a 4-inch panel.
// Clamp max is min(720/320, 720/240) = 2.25 (menu virtual size is 320x240).
set r_hudscale 2.25
set r_menuscale 2.25
set r_consolescale 2.25
set crosshair_scale 2.25
set crosshair 0

// Official 3.14 demo maps start at demo1 (Outer Base).
alias d1 "map demo1"
set nextserver ""
set nextdemo ""
set con_notifytime 0

// D-pad is analog axes a0/a1 exposed as DP_* (same hardware as Q3).
// Analog left stick stays unused so we do not double movement.
set joy_layout 0
set joy_left_deadzone 0.5
set joy_right_deadzone 0.5
set joy_confirm 0

unbind BTN_SOUTH
unbind BTN_EAST
unbind BTN_WEST
unbind BTN_NORTH
unbind BTN_BACK
unbind SHOULDR_LEFT
unbind SHOULDR_RIGHT
unbind DP_UP
unbind DP_DOWN
unbind DP_LEFT
unbind DP_RIGHT

bind DP_UP "+forward"
bind DP_DOWN "+back"
bind DP_LEFT "+left"
bind DP_RIGHT "+right"
bind BTN_SOUTH "+attack"
bind BTN_EAST "+moveup"
bind BTN_WEST "weapprev"
bind BTN_NORTH "weapnext"
bind SHOULDR_LEFT "+lookdown"
bind SHOULDR_RIGHT "+lookup"
bind BTN_BACK "inven"
