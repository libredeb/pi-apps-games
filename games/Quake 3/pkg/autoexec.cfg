// Arduino Leonardo (SDL gamecontroller) — ioquake3
// D-pad is analog axes a0/a1 exposed as DPAD_* via SDL_GAMECONTROLLERCONFIG.
seta in_joystick 1
seta in_joystickUseAnalog 0
seta cl_run 1
seta cl_yawspeed 120
seta cl_pitchspeed 120

unbind PAD0_DPAD_UP
unbind PAD0_DPAD_DOWN
unbind PAD0_DPAD_LEFT
unbind PAD0_DPAD_RIGHT
unbind PAD0_A
unbind PAD0_B
unbind PAD0_X
unbind PAD0_Y
unbind PAD0_LEFTSHOULDER
unbind PAD0_RIGHTSHOULDER
unbind PAD0_START
unbind PAD0_BACK

bind PAD0_DPAD_UP "+forward"
bind PAD0_DPAD_DOWN "+back"
bind PAD0_DPAD_LEFT "+left"
bind PAD0_DPAD_RIGHT "+right"
bind PAD0_A "+attack"
bind PAD0_B "+moveup"
bind PAD0_X "weapprev"
bind PAD0_Y "weapnext"
bind PAD0_LEFTSHOULDER "+lookdown"
bind PAD0_RIGHTSHOULDER "+lookup"
bind PAD0_START "togglemenu"
bind PAD0_BACK "+scores"
