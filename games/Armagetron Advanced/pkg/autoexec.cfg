# GamerCard defaults for Armagetron Advanced.
#
# autoexec.cfg is the file upstream itself recommends for overrides (see
# settings.cfg): it's read after user.cfg/settings.cfg/default.cfg on every
# single start, so these values always win, regardless of what a player
# changes from the in-game menu. That's exactly what we want on a console
# with a fixed 720x720 screen and no keyboard.

# Fill the Hyperpixel 4.0 panel (720x720) in fullscreen.
# 14 = ArmageTron_Custom, see rScreen.h
ARMAGETRON_SCREENMODE 14
ARMAGETRON_SCREENMODE_W 720
ARMAGETRON_SCREENMODE_H 720
CUSTOM_SCREEN_WIDTH 720
CUSTOM_SCREEN_HEIGHT 720
CUSTOM_SCREEN_ASPECT 1
FULLSCREEN 1

# Cursor-key control scheme for player 1: Left/Right turn the cycle, Down
# and Space brake. The gamepad's D-pad and buttons are turned into these
# same key events by pkg/patch-gamepad.py, so this binds both at once.
KEYBOARD 276 PLAYER_BIND CYCLE_TURN_LEFT  1
KEYBOARD 275 PLAYER_BIND CYCLE_TURN_RIGHT 1
KEYBOARD 274 PLAYER_BIND CYCLE_BRAKE      1
KEYBOARD 32  PLAYER_BIND CYCLE_BRAKE      1
